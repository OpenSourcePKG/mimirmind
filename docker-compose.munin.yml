# docker-compose.munin.yml — attached deploy for M-Munin.
#
# Purpose: deliver the deploy-downtime case of M-Munin. Munin runs
# long-lived (unless-stopped), holds the models in USM(host) and exports
# them over L0-IPC to an attached mimirmind worker. A worker redeploy pulls
# the small mimirmind:latest again while Munin stays untouched — the 90 s
# load downtime of the standalone path becomes a ~2 s worker restart.
#
# Prerequisites:
#   - Prebuilt images in the registry:
#       ${MUNIN_IMAGE:-munin:latest}         — the small Munin-only image
#       ${MIMIRMIND_IMAGE:-mimirmind:latest} — the full inference image
#     Both build from the same Dockerfile (target: munin_runtime vs
#     runtime). The registry push is done by the user.
#   - GGUFs under ${MIMIRMIND_MODELS_DIR} (default: ./models)
#   - Host config under ${MIMIRMIND_CONFIG_HOST} (default: ./config.json)
#   - Intel iGPU/dGPU under /dev/dri
#
# Compose-control env vars:
#   export MUNIN_IMAGE=docker-registry.example.com/munin:latest
#   export MIMIRMIND_IMAGE=docker-registry.example.com/mimirmind:latest
#   export MIMIRMIND_MODELS_DIR=/srv/llm-models
#   export MIMIRMIND_CONFIG_HOST=/etc/mimirmind/config.json
#   export MIMIRMIND_RENDER_GID=$(getent group render | cut -d: -f3)
#   export MIMIRMIND_VIDEO_GID=$(getent group video  | cut -d: -f3)
#   export MIMIRMIND_PORT=8080
#
# The server is HTTPS + auth ON by default (config server.tls / server.auth);
# the curl examples below use `-k` (self-signed) + an Authorization header.
#
# Workflows:
#
# ── Initial bringup ───────────────────────────────────────────────────────
#
#   # 1) Start Munin and load the models (takes as long as a full standalone
#   #    boot — the 90 s are here, but only once).
#   docker compose -f docker-compose.munin.yml up -d munin
#
#   # 2) Verify Munin holds the models.
#   docker compose -f docker-compose.munin.yml logs -f munin
#   # Expected line: "ModelStore: N model(s) resident in USM"
#
#   # 3) Start the attached worker.
#   docker compose -f docker-compose.munin.yml up -d mimirmind
#
#   # 4) Try a chat.
#   curl -k -s https://localhost:${MIMIRMIND_PORT:-8080}/health \
#       -H 'Authorization: Bearer <your-key>'
#   curl -k -s https://localhost:${MIMIRMIND_PORT:-8080}/v1/chat/completions \
#       -H 'Authorization: Bearer <your-key>' \
#       -H 'Content-Type: application/json' \
#       -d '{"messages":[{"role":"user","content":"Hi!"}]}'
#
# ── Worker redeploy (the business case) ───────────────────────────────────
#
#   # Munin keeps running. Only the worker is reloaded.
#   docker compose -f docker-compose.munin.yml pull mimirmind
#   docker compose -f docker-compose.munin.yml up -d mimirmind
#
#   # Downtime = worker container kill + restart + healthz + attach = ~2 s.
#   # Munin's healthz session keeps the USM pointers available; the new
#   # worker imports directly via SCM_RIGHTS + zeMemOpenIpcHandle.
#
# ── Munin redeploy (rare) ─────────────────────────────────────────────────
#
#   # When Munin itself is redeployed, all attached workers go down with it
#   # (the USM pointers are invalidated). Expected downtime equals the
#   # standalone boot. Pick the maintenance window accordingly.
#   docker compose -f docker-compose.munin.yml pull munin
#   docker compose -f docker-compose.munin.yml up -d --force-recreate munin
#   docker compose -f docker-compose.munin.yml restart mimirmind
#
# ── Governor ownership ────────────────────────────────────────────────────
#
# Munin acquires the flock on /var/run/mimirmind/governor.lock at startup.
# The attached worker checks this via healthz and skips its own
# ThermalGuard/GpuClockGovernor/FanController install. A second standalone
# mimirmind on the same host would fail to get Munin's flock and fail-fast
# with a clear message — which is exactly the intent.

services:

    # ------------------------------------------------------------------
    # munin — persistent model-memory daemon (M-Munin Tier-1).
    #         Long-lived, holds all loadOnStart models in USM(host) and
    #         exports them via L0-IPC to attached workers.
    # ------------------------------------------------------------------
    munin:
        image: ${MUNIN_IMAGE:-munin:latest}
        container_name: mimirmind-munin
        pull_policy: always
        restart: unless-stopped

        # Munin needs /dev/dri to call zeMemAllocHost + zeMemGetIpcHandle.
        # No kernel dispatch — Munin holds memory, compiles nothing, computes
        # nothing (see the ADR hard-no list).
        devices:
            - /dev/dri:/dev/dri

        group_add:
            - "${MIMIRMIND_RENDER_GID:-104}"
            - "${MIMIRMIND_VIDEO_GID:-44}"

        # No systempaths=unconfined — Munin reads no RAPL counters. sysfs
        # governance writes go over a separate route (see below) that the
        # attached worker does not need.

        environment:
            UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
            UR_L0_USE_RELAXED_ALLOCATION_LIMITS:    "1"

        volumes:
            # Shared socket + governor lock. Both containers see the same
            # inode through the named volume.
            - mimirmind_run:/var/run/mimirmind

            # Models read-only. Munin opens the GGUFs, copies the tensors
            # into USM, and closes the mmap — the models could be removed
            # afterwards, but we keep the mount for debugging.
            - ${MIMIRMIND_MODELS_DIR:-./models}:/models:ro

            # Config bind mount. Munin reads only runtime.* and models.* from
            # the same config.json as mimirmind.
            - ${MIMIRMIND_CONFIG_HOST:-./config.json}:/etc/mimirmind/config.json:ro

            # iGPU sysfs for governor ownership (Munin may, the worker may
            # not). Even though the governor reload is not wired into Munin
            # yet, the route must be open — otherwise a later SIGHUP-based
            # reload in the same container would fail.
            - /sys/class/drm:/sys/class/drm:rw
            - /sys/devices:/sys/devices:rw

        command:
            - --config
            - /etc/mimirmind/config.json
            - --socket
            - /var/run/mimirmind/munin.sock

        # Healthcheck via pure socket existence. A full healthz roundtrip
        # would need a client binary in the Munin image, which is not there
        # (the Munin image is deliberately minimal). Socket existence is the
        # first proof that listen() ran — Munin only creates it once the
        # ModelStore has finished loading.
        healthcheck:
            test: ["CMD", "test", "-S", "/var/run/mimirmind/munin.sock"]
            interval: 5s
            timeout: 2s
            retries: 30
            start_period: 120s   # allow slow initial model load (~90 s)

    # ------------------------------------------------------------------
    # mimirmind — attached inference worker.
    #             Short-lived, restart:no, uses L0-IPC over
    #             /var/run/mimirmind/munin.sock instead of its own
    #             GgufReader::loadTensors.
    # ------------------------------------------------------------------
    mimirmind:
        image: ${MIMIRMIND_IMAGE:-mimirmind:latest}
        container_name: mimirmind-worker
        pull_policy: always
        restart: "no"

        depends_on:
            munin:
                condition: service_healthy

        devices:
            - /dev/dri:/dev/dri

        group_add:
            - "${MIMIRMIND_RENDER_GID:-104}"
            - "${MIMIRMIND_VIDEO_GID:-44}"

        # Only the worker reads RAPL for the per-request usage reports.
        security_opt:
            - systempaths=unconfined

        environment:
            UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
            UR_L0_USE_RELAXED_ALLOCATION_LIMITS:    "1"

        volumes:
            # Shared volume for the Munin socket.
            - mimirmind_run:/var/run/mimirmind

            # The worker still opens the GGUFs for the header parse
            # (LlmConfig + tokenizer + fingerprint verify) but no longer
            # copies tensors — those come over IPC from Munin.
            - ${MIMIRMIND_MODELS_DIR:-./models}:/models:ro

            # State + logs as in the standalone setup. The per-tenant metrics
            # store (mimir-tenant-metrics.json) also persists here.
            - ./run-logs:/logs:rw
            - ${MIMIRMIND_STATE_DIR:-./run-state}:/root/.cache/mimirmind:rw

            # Config identical to Munin's config (the same bind mount is
            # mandatory, otherwise the fingerprint-refuse path triggers when
            # models[].path diverges).
            - ${MIMIRMIND_CONFIG_HOST:-./config.json}:/etc/mimirmind/config.json:ro

            # Do NOT mount sysfs — in attached mode the worker must not touch
            # /sys/class/drm. Munin owns that.

        command:
            - serve
            - --config
            - /etc/mimirmind/config.json
            - --attach
            - unix:/var/run/mimirmind/munin.sock

        ports:
            - "${MIMIRMIND_PORT:-8080}:8080"

        stdin_open: true
        tty: true

volumes:
    # tmpfs for fast fd passing. Does not persist across a host reboot,
    # which is exactly what we want — /var/run/ semantics.
    mimirmind_run:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
